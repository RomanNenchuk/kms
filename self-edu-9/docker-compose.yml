name: sr9-graph-compare

# Три сховища з однаковим «бюджетом»: ~1 ГБ heap/пам'яті кожному, щоб порівняння було чесним.
services:
  neo4j:
    image: neo4j:${NEO4J_TAG:-5.26-community}
    container_name: sr9-neo4j
    ports:
      - "7474:7474"   # Neo4j Browser (HTTP)
      - "7687:7687"   # Bolt
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-sr9password}
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1g
      NEO4J_server_memory_pagecache_size: 256m
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s

  memgraph:
    image: memgraph/memgraph-mage:${MEMGRAPH_TAG:-latest}
    container_name: sr9-memgraph
    ports:
      - "7688:7687"   # Bolt (7688 на хості, щоб не конфліктувати з Neo4j)
      - "7444:7444"   # логи
    command: ["--telemetry-enabled=false", "--log-level=WARNING", "--also-log-to-stderr=true"]
    volumes:
      - memgraph_data:/var/lib/memgraph
    healthcheck:
      test: ["CMD-SHELL", "echo 'RETURN 1;' | mgconsole || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 5s

  graphdb:
    # 10.x працює як Free без ліцензійного файлу; з 11.0 навіть Free потребує ліцензії від Graphwise
    image: ontotext/graphdb:${GRAPHDB_TAG:-10.7.1}
    container_name: sr9-graphdb
    ports:
      - "7200:7200"   # Workbench + REST + SPARQL endpoint
    environment:
      GDB_JAVA_OPTS: "-Xms512m -Xmx1g"
    volumes:
      - graphdb_data:/opt/graphdb/home
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/7200' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

volumes:
  neo4j_data:
  memgraph_data:
  graphdb_data:
