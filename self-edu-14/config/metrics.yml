# СР14 — 8 метрик якості знань для KMS «управління авіаційними перевезеннями».
# Значення метрики = частка «добрих» елементів (0..1); метрика пройдена, якщо value >= threshold сценарію.
# Пороги задано за призначенням сценарію (а не за виміряними значеннями); перевірка на чистому еталоні lab11 — у README.
reference_date: "2026-11-14"

scenarios:
  chat:
    name: "Чат підтримки (RAG-асистент)"
    use: "Асистент відповідає користувачам, цитуючи фрагменти корпусу й факти графа. Хибна впевнена відповідь гірша, ніж «не знаю»; застарілий або продубльований контекст псує відповідь."
  audit:
    name: "Аудит"
    use: "Перевірка походження й цілісності даних постфактум. Кожен факт має мати джерело й не суперечити іншим; дані дивляться «на дату», тому давність не критична."

metrics:
  - id: Q1
    lab14: M01
    name: completeness_attributes
    dimension: повнота
    scope: "граф, таблиці вузлів"
    formula: "Q1 = непорожні комірки / усі комірки у flights, aircraft, pilots, passengers, airports, delays, risks"
    thresholds: {chat: 0.98, audit: 0.999}
    why:
      chat: "Порожній атрибут зазвичай дає відмову «не знаю», а не хибну відповідь, тому допускається до 2 % пропусків."
      audit: "Порожнє поле є прогалиною в доказах; допуск лише ≤ 1 на 1000 комірок."

  - id: Q2
    lab14: M02
    name: provenance_fields
    dimension: походження
    scope: "граф, таблиці зв'язків"
    formula: "Q2 = зв'язки з непорожніми source, confidence, validFrom / усі зв'язки"
    thresholds: {chat: 0.99, audit: 1.0}
    why:
      chat: "Асистент цитує джерело; для кількох відсотків зв'язків можна відповісти без цитати, але не для більшості."
      audit: "Зв'язок без джерела не можна перевірити, тому допуск нульовий."

  - id: Q3
    lab14: M04
    name: consistency_functional_relations
    dimension: узгодженість
    scope: "граф, функціональні зв'язки"
    formula: "Q3 = початкові вузли з ≤ 1 різним кінцем / усі початкові вузли для operatedBy, usesAircraft, departsFrom, arrivesAt, ownedBy, locatedIn, inCountry"
    thresholds: {chat: 0.999, audit: 1.0}
    why:
      chat: "Два оператори в одного рейсу дають суперечливі відповіді; допуск ≤ 1 на 1000 вузлів."
      audit: "Пряма суперечність є дефектом за означенням, допуск нульовий."

  - id: Q4
    lab14: M07
    name: corpus_freshness
    dimension: актуальність
    scope: "корпус"
    formula: "Q4 = фрагменти з date не старшими за 365 днів на дату зрізу / усі фрагменти"
    max_age_days: 365
    thresholds: {chat: 0.95, audit: 0.80}
    why:
      chat: "Застарілий фрагмент подається як чинний факт, а RAG не розрізняє копії за датою; потрібна висока частка свіжих."
      audit: "Аудит відтворює стан на дату, давній, але датований фрагмент не є помилкою; достатньо 80 %."

  - id: Q5
    lab14: M08
    name: uniqueness_entities
    dimension: унікальність
    scope: "граф: passengers, pilots, airports, aircraft"
    formula: "Q5 = 1 − (сутності, що входять у кандидатні дублікати за грубим правилом / усі сутності); правило: token_sort_ratio ≥ 90 після нормалізації, або ініціал + те саме прізвище, або однаковий нормалізований реєстраційний номер"
    thresholds: {chat: 0.95, audit: 0.98}
    why:
      chat: "Розщеплена історія особи рідко змінює відповідь на питання про текст; допускається до 5 % підозрілих сутностей."
      audit: "Дублікати спотворюють підрахунки й простежуваність; поріг 98 % — найвищий із круглих значень, який чисте сховище lab11 (0,986) ще проходить."

  - id: Q6
    lab14: M09
    name: uniqueness_chunks
    dimension: унікальність
    scope: "корпус"
    formula: "Q6 = 1 − (зайві фрагменти-копії / усі фрагменти); копія = token_set_ratio ≥ 90 із фрагментом іншого документа, що йде раніше за doc_id"
    thresholds: {chat: 0.98, audit: 0.90}
    why:
      chat: "Копії забивають top-k однаковим контекстом і витісняють різні джерела; допуск до 2 %."
      audit: "Копії тексту не змінюють ланцюжок доказів у графі; достатньо 90 %."

  - id: Q7
    lab14: M11
    name: validity_value_ranges
    dimension: валідність
    scope: "граф"
    formula: "Q7 = значення в допустимих межах або форматі / усі перевірені значення (flightHours 0–40000, delays.minutes 0–720, risks.level 1–5, seatCapacity 1–900 (для вантажних …F допустимо 0), дати ISO)"
    thresholds: {chat: 0.995, audit: 0.999}
    why:
      chat: "Поодиноке значення поза межами рідко потрапляє у відповідь, допуск 5 на 1000."
      audit: "Значення поза діапазоном є ознакою помилки вимірювання або внесення; допуск ≤ 1 на 1000."

  - id: Q8
    lab14: M13
    name: accessibility_metadata
    dimension: доступність
    scope: "корпус"
    formula: "Q8 = фрагменти з коректним sensitivity ∈ {public, internal, restricted}, http(s) source_url і непорожнім текстом / усі фрагменти"
    thresholds: {chat: 1.0, audit: 1.0}
    why:
      chat: "Без мітки доступу асистент може показати закрите; без source_url немає цитати. Жорстке обмеження."
      audit: "Мітки доступу й джерело потрібні для перевірки прав; жорстке обмеження."

# Метрики з ЛР 14, які в цю роботу не взято
rejected:
  - {lab14: M06, name: accuracy_expert_sample, reason: "точність вимірюється лише експертною розміткою вибірки, автоматично не обчислюється"}
  - {lab14: M14, name: accessibility_index_coverage, reason: "потребує побудованого індексу e5 (~12 МБ на стан) і не додає вимір, який уже покрито Q8"}
  - {lab14: M03, name: consistency_logic_flights, reason: "той самий вимір «узгодженість», що Q3; Q3 перевіряє прямі суперечності"}
  - {lab14: M05, name: consistency_terminology, reason: "вузька перевірка словника моделей літаків; вимір «узгодженість» уже покрито Q3"}
  - {lab14: M10, name: provenance_license_consistency, reason: "вимір «походження» уже покрито Q2; ліцензія є юридичною, а не якісною метрикою"}
  - {lab14: M12, name: validity_referential_integrity, reason: "на всіх трьох станах дорівнює 1.0 і не розрізняє стани; вимір «валідність» покрито Q7"}
